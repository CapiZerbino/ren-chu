name: CI

# Mỗi push / pull request vào main: go vet + go test (Linux, cần WebKitGTK cho Wails)
# và typecheck + build giao diện. Không đóng gói — việc đó ở release.yml khi gắn thẻ.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Go + giao diện
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Thư viện GTK/WebKit
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config
      - name: Build giao diện (typecheck + vite)
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: go vet + go test
        run: |
          go vet -tags webkit2_41 ./...
          go test -tags webkit2_41 ./... -count=1
